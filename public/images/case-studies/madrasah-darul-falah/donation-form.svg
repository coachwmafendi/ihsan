<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="Ihsan donation form embedded on the madrasah website">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0fdfa"/>
      <stop offset="1" stop-color="#ccfbf1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1000" height="560" fill="url(#bg)"/>
  <circle cx="140" cy="100" r="150" fill="#5eead4" opacity="0.25"/>
  <circle cx="880" cy="480" r="180" fill="#2dd4bf" opacity="0.18"/>

  <!-- donation form card -->
  <g filter="url(#shadow)">
    <rect x="330" y="55" width="340" height="450" rx="22" fill="#ffffff"/>
  </g>
  <text x="500" y="105" text-anchor="middle" font-family="'Instrument Sans', system-ui, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Tabung Pembangunan</text>
  <text x="500" y="132" text-anchor="middle" font-family="'Instrument Sans', system-ui, sans-serif" font-size="14" fill="#64748b">Madrasah Darul Falah</text>

  <!-- frequency toggle -->
  <rect x="360" y="155" width="280" height="42" rx="21" fill="#f1f5f9"/>
  <rect x="502" y="159" width="134" height="34" rx="17" fill="#0d9488"/>
  <text x="431" y="182" text-anchor="middle" font-family="'Instrument Sans', system-ui, sans-serif" font-size="15" fill="#64748b">Sekali</text>
  <text x="569" y="182" text-anchor="middle" font-family="'Instrument Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Bulanan</text>

  <!-- amount buttons -->
  <g font-family="'Instrument Sans', system-ui, sans-serif" font-size="16" font-weight="600">
    <rect x="360" y="220" width="86" height="48" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="403" y="250" text-anchor="middle" fill="#334155">RM 30</text>
    <rect x="457" y="220" width="86" height="48" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
    <text x="500" y="250" text-anchor="middle" fill="#0f766e">RM 50</text>
    <rect x="554" y="220" width="86" height="48" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="597" y="250" text-anchor="middle" fill="#334155">RM 100</text>
  </g>

  <!-- custom amount field -->
  <rect x="360" y="284" width="280" height="48" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="378" y="314" font-family="'Instrument Sans', system-ui, sans-serif" font-size="15" fill="#94a3b8">Jumlah lain (RM)</text>

  <!-- cover fee checkbox -->
  <rect x="360" y="348" width="18" height="18" rx="5" fill="#0d9488"/>
  <path d="M364 357 l4 4 l7 -8" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="388" y="362" font-family="'Instrument Sans', system-ui, sans-serif" font-size="13" fill="#475569">Saya tanggung processing fee</text>

  <!-- donate button -->
  <rect x="360" y="386" width="280" height="52" rx="26" fill="#0d9488"/>
  <text x="500" y="419" text-anchor="middle" font-family="'Instrument Sans', system-ui, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Derma Sekarang</text>

  <!-- secure note -->
  <g transform="translate(413 458)">
    <rect x="0" y="-11" width="10" height="8" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.6"/>
    <path d="M2 -11 v-3 a3 3 0 0 1 6 0 v3" fill="none" stroke="#94a3b8" stroke-width="1.6"/>
  </g>
  <text x="432" y="458" font-family="'Instrument Sans', system-ui, sans-serif" font-size="13" fill="#94a3b8">Selamat · Dikuasakan oleh Ihsan</text>
</svg>
