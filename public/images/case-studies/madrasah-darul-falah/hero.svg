      <stop offset="0" stop-color="#f0fdfa"/>
      <stop offset="1" stop-color="#99f6e4"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <circle cx="1360" cy="110" r="280" fill="#5eead4" opacity="0.32"/>
  <circle cx="170" cy="640" r="320" fill="#2dd4bf" opacity="0.16"/>
