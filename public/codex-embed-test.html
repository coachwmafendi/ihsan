<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ihsan Embed Test</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #172033;
            background: #f7f4ee;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 28px;
        }

        main {
            display: grid;
            gap: 18px;
            max-width: 960px;
            margin: 0 auto;
        }

        header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
        }

        h1 {
            margin: 0;
            font-size: 22px;
            line-height: 1.2;
        }

        p {
            margin: 6px 0 0;
            color: #5f6678;
        }

        button,
        a.button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 0 16px;
            border: 0;
            border-radius: 8px;
            color: #ffffff;
            background: #11664f;
            font: inherit;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .panel {
            overflow: hidden;
            border: 1px solid #ded7ca;
            border-radius: 8px;
            background: #ffffff;
            box-shadow: 0 14px 36px rgba(23, 32, 51, .08);
        }

        iframe {
            display: block;
            width: 100%;
            min-height: 760px;
            border: 0;
            background: #ffffff;
        }
    </style>
</head>
<body>
    <main>
        <header>
            <div>
                <h1>Ihsan Embed Test</h1>
                <p>Hosted form and checkout modal smoke test.</p>
            </div>

            <div class="actions">
                <button type="button" data-ihsan-form="CODEXQA">Open checkout</button>
                <a class="button" href="https://ihsan.test/donate/codex-qa-form-token?embed=1">Open form</a>
            </div>
        </header>

        <section class="panel" aria-label="Hosted donation form">
            <iframe
                title="Ihsan donation form"
                src="https://ihsan.test/donate/codex-qa-form-token?embed=1"
                loading="eager"
                allow="payment *"
            ></iframe>
        </section>
    </main>

    <script src="https://ihsan.test/embed.js"></script>
</body>
</html>
